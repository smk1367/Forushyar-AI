name: Backend tests

on:
  pull_request:
    branches:
      - feature/assistant-real-inventory-v0.4.12
  push:
    branches:
      - feature/sales-quote-preview-v0.5.0
      - feature/atomic-sales-orders-v0.6.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: forushyar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d forushyar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      API_KEY: forushyar-ci-test-key-0000000000000000
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/forushyar_test
      REDIS_URL: redis://127.0.0.1:6379/0
      PYTHONPATH: backend
      RUN_POSTGRES_INTEGRATION_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Apply database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run backend test suite
        run: python -m pytest -q -p no:cacheprovider backend/tests

      - name: Compile backend modules
        run: python -m compileall -q backend/app backend/tests

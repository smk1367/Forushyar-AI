name: Backend tests

on:
  pull_request:
    branches:
      - feature/assistant-real-inventory-v0.4.12
  push:
    branches:
      - feature/sales-quote-preview-v0.5.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      API_KEY: forushyar-ci-test-key-0000000000000000
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/forushyar_test
      REDIS_URL: redis://127.0.0.1:6379/0
      PYTHONPATH: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run backend test suite
        run: python -m pytest -q -p no:cacheprovider backend/tests

      - name: Compile backend modules
        run: python -m compileall -q backend/app backend/tests

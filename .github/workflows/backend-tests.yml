name: backend-tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: development
      API_KEY: ci-test-api-key-00000000000000000000000000000000
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/forushyar
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: pytest -q
      - name: Validate Alembic migration generation
        run: alembic upgrade head --sql > /tmp/forushyar-migrations.sql
